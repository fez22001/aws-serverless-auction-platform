name: Auction offline validation
on:
  push:
    paths: ['hw10/**', 'ReactAuction/**', 'infra/**', 'scripts/**', 'tests/**', 'local/**', 'pytest.ini', '.github/workflows/**']
  pull_request:
    paths: ['hw10/**', 'ReactAuction/**', 'infra/**', 'scripts/**', 'tests/**', 'local/**', 'pytest.ini', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: bash scripts/setup-local.sh
      - name: Install isolated infrastructure validator
        run: |
          python3 -m venv .tools/infra-venv
          .tools/infra-venv/bin/pip install -r local/requirements-infra.txt
      - name: Validate checked-in templates and isolated tests
        run: |
          python3 scripts/build_infra.py --check
          .tools/infra-venv/bin/cfn-lint infra/bootstrap.json infra/application.json
          .venv/bin/python -m pytest --junitxml=.local/tests.xml
          bash scripts/npm.sh run lint
          bash scripts/npm.sh run build
          python3 scripts/release.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-auction-release
          path: |
            .local/releases/
            .local/tests.xml
          include-hidden-files: true
